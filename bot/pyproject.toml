[project]
name = "geco-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot>=22",
  "google-adk",
  "google-genai",
  "pydantic>=2",
  "psycopg[binary,pool]>=3.2",
  "openpyxl",
  "xlrd",
  "python-dotenv",
  "fpdf2",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
